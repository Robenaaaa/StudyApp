<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#171b30">
<title>유령집사의 공부방</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rain-layer" id="rainLayer" aria-hidden="true"></div>

<div class="rotate-prompt">
  <div class="rotate-emoji">📱↻</div>
  <div>화면을 가로로 돌려주세요</div>
  <button class="btn btn-primary btn-sm" id="fullscreenBtn" style="margin-top:14px;">전체화면 · 가로모드로 보기</button>
</div>

<div class="app">

  <!-- 상단 바 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-ghost">👻</span>
      <span class="brand-text">유령집사의 공부방</span>
    </div>
    <div class="coin-badge" id="coinBadge">
      <span class="coin-icon">🪙</span>
      <span id="coinAmount">0</span>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main id="mainView" class="main-view"></main>

  <!-- 하단 탭 네비게이션 -->
  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home"><span class="tab-icon">🏠</span><span>홈</span></button>
    <button class="tab-btn" data-tab="todo"><span class="tab-icon">📝</span><span>할일</span></button>
    <button class="tab-btn" data-tab="timetable"><span class="tab-icon">🗓️</span><span>시간표</span></button>
    <button class="tab-btn" data-tab="shop"><span class="tab-icon">🛍️</span><span>상점</span></button>
    <button class="tab-btn" data-tab="stats"><span class="tab-icon">📈</span><span>통계</span></button>
  </nav>

</div>

<!-- 알림/토스트 -->
<div class="toast" id="toast"></div>

<!-- 책장 클릭 시 뜨는 팝업 (오늘의 할일 / 통계 / 사진첩 / 식물도감) -->
<div class="modal-overlay" id="bookshelfModal">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-tabs" id="bookshelfTabs">
        <button class="modal-tab-btn" data-bookshelf-tab="todo">📝 오늘의 할일</button>
        <button class="modal-tab-btn" data-bookshelf-tab="stats">📈 통계</button>
        <button class="modal-tab-btn" data-bookshelf-tab="album">🖼️ 사진첩</button>
        <button class="modal-tab-btn" data-bookshelf-tab="plants">🌱 식물도감</button>
      </div>
      <button class="modal-close" id="bookshelfModalClose" aria-label="닫기">✕</button>
    </div>
    <div class="modal-body" id="bookshelfModalBody"></div>
  </div>
</div>

<!-- 액자 클릭 시 뜨는 사진 팝업 -->
<div class="modal-overlay" id="frameModal">
  <div class="frame-modal-panel">
    <button class="modal-close frame-modal-close" id="frameModalClose" aria-label="닫기">✕</button>
    <img id="frameModalImg" src="" class="frame-modal-img" alt="액자 사진">
    <button class="modal-change-photo" id="frameModalChangeBtn" title="사진 변경" aria-label="사진 변경">🔄</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
